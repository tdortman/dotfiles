providers:
  neuralwatt:
    baseUrl: https://api.neuralwatt.com/v1
    apiKey: "! cat ~/.omp/agent/api-keys/neuralwatt"
    api: openai-completions
    authHeader: true

    compat:
      maxTokensField: max_tokens
      supportsReasoningEffort: true
      thinkingFormat: openai
      supportsStrictMode: true

    models:
      - id: glm-5.2
        name: NeuralWatt GLM-5.2
        reasoning: true
        thinking: &glm52_thinking
          mode: effort
          efforts: [high, xhigh]
          defaultLevel: high
          effortMap:
            xhigh: max
        input: [text]
        contextWindow: 1048576
        maxTokens: 131072
        cost:
          input: 1.45
          output: 4.50
          cacheRead: 0.3625
          cacheWrite: 0

      - id: glm-5.2-fast
        name: NeuralWatt GLM-5.2 No Reasoning
        reasoning: false
        input: [text]
        contextWindow: 1048576
        maxTokens: 131072
        cost:
          input: 1.45
          output: 4.50
          cacheRead: 0.3625
          cacheWrite: 0

      - id: glm-5.2-short
        name: NeuralWatt GLM-5.2 Short
        reasoning: true
        thinking: *glm52_thinking
        input: [text]
        contextWindow: 195000
        maxTokens: 131072
        cost:
          input: 1.45
          output: 4.50
          cacheRead: 0.3625
          cacheWrite: 0

      - id: glm-5.2-short-fast
        name: NeuralWatt GLM-5.2 Short No Reasoning
        reasoning: false
        input: [text]
        contextWindow: 195000
        maxTokens: 131072
        cost:
          input: 1.45
          output: 4.50
          cacheRead: 0.3625
          cacheWrite: 0
