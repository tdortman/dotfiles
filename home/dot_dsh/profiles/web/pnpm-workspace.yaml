packages:
  - .

nodeLinker: hoisted
autoInstallPeers: false
minimumReleaseAgeExclude:
  - dsh-codex@0.2.6 || 0.2.7 || 0.3.0
  - '@michengai/dsh-archive-manager@0.1.24'
  - dsh-context@0.41.0 || 0.52.0
  - dsh-rewind-plugin@0.7.3 || 0.12.2
  - '@michengai/dsh-archive-manager@1.0.8'
  - dsh-client-auto-continue@0.12.0
  - dsh-codex@0.3.2
  - dsh-rewind-plugin@0.15.0
allowBuilds:
  '@google/genai': true
  protobufjs: true

overrides:
  # archive-manager's optional peer makes pnpm hoist dsh-session-format-catalog and,
  # through it, dsh-compaction-image-offload. Their peers are exact versions, so a
  # copy that differs from the running dsh disables the bundled image-offload row.
  # Keep this equal to the dsh version in use.
  '@deepseek-ai/dsh-session-format-catalog': 0.2.0-rc.2
