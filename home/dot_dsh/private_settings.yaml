ui-onboarding:
  welcomeNoticeVersion: 2026-08-13.1
agent-default-model:
  provider: opencode-goo-deepseek
  model: deepseek-v4.1-flash
  reasoningEffort: high
agent-presets:
  default: custom-ptc
skill-injector:
  mode: each-prompt
  selected:
    - ponytail
    - unslop
    - forward-implementation-first
    - i-have-adhd
llm-pi-ai:
  providers:
    opencode-zen-muse:
      displayName: OpenCode Zen
      apiKeyEnv: OPENCODE_API_KEY
      api: openai-responses
      baseURL: https://opencode.ai/zen/v1
      models:
        - id: muse-spark-1.3-contributor-free
          name: Muse Spark 1.3 Contributor Free
          contextWindow: 1048576
          maxTokens: 943718
          input: [text, image]
          reasoningEfforts:
            { minimal: "minimal", low: "low", medium: "medium", high: "high", xhigh: "xhigh" }

    opencode-goo-muse:
      displayName: OpenCode Go - Muse
      apiKeyEnv: OPENCODE_API_KEY
      api: openai-responses
      baseURL: https://opencode.ai/zen/go/v1

      reasoning: xhigh

      streamIdleTimeoutMs: 300000

      models:
        - id: muse-spark-1.3-contributor
          name: Muse Spark 1.3 Contributor

          contextWindow: 1048576
          maxTokens: 131072

          input:
            - text
            - image

          reasoningEfforts:
            "off":
            minimal: minimal
            low: low
            medium: medium
            high: high
            xhigh: xhigh

    # DeepSeek V4.1 Flash
    opencode-goo-deepseek:
      displayName: OpenCode Go - DeepSeek
      apiKeyEnv: OPENCODE_API_KEY
      api: openai-completions
      baseURL: https://opencode.ai/zen/go/v1

      reasoning: high

      streamIdleTimeoutMs: 300000

      compat:
        supportsStore: false
        supportsDeveloperRole: false
        supportsReasoningEffort: true
        maxTokensField: max_tokens
        requiresReasoningContentOnAssistantMessages: true
        thinkingFormat: deepseek

      models:
        - id: deepseek-v4.1-flash
          name: DeepSeek V4.1 Flash

          contextWindow: 1000000
          maxTokens: 384000

          input:
            - text
            - image

          reasoningEfforts:
            "off":
            low: low
            high: high
            max: max
openai-codex:
  useNativeCompaction: true
  useWebSocketContextReuse: true
  useStatefulResponses: false
  models:
    - gpt-6-astra
    - gpt-5.6-luna
    - gpt-5.6-sol
    - gpt-5.6-terra
    - gpt-5.3-codex-spark
  proxyMode: off
  contextWindow: 272000
permission:
  defaultPreset: danger-full-access
subagent-effort:
  model: gpt-5.6-luna
  reasoningEffort: max
auto-continue:
  locale: en
