ui-onboarding:
  welcomeNoticeVersion: 2026-08-13.1
agent-default-model:
  provider: openai-codex
  model: gpt-6-astra
  reasoningEffort: low
agent-presets:
  default: custom-ptc
skill-injector:
  mode: each-prompt
  selected:
    - ponytail
    - unslop
    - forward-implementation-first
    - i-have-adhd
llm-pi-ai:
  providers:
    opencode-zen-muse:
      displayName: OpenCode Zen
      apiKeyEnv: OPENCODE_API_KEY
      api: openai-responses
      baseURL: https://opencode.ai/zen/v1
      models:
        - id: muse-spark-1.3-contributor-free
          name: Muse Spark 1.3 Contributor Free
          contextWindow: 1048576
          maxTokens: 943718
          input: [ text, image ]
          reasoningEfforts:
            {
              minimal: "minimal",
              low: "low",
              medium: "medium",
              high: "high",
              xhigh: "xhigh"
            }
openai-codex:
  useNativeCompaction: true
  useWebSocketContextReuse: true
  useStatefulResponses: false
  models:
    - gpt-6-astra
    - gpt-5.6-luna
    - gpt-5.6-sol
    - gpt-5.6-terra
    - gpt-5.3-codex-spark
  proxyMode: off
  contextWindow: 272000
permission:
  defaultPreset: danger-full-access
subagent-effort:
  model: gpt-5.6-luna
  reasoningEffort: max
llm-opencode-go:
  models:
    - id: kimi-k3
      name: Kimi K3
      contextWindow: 1048576
      maxTokens: 131072
      vision: true
      thinking: true
      defaultEffort: max
      api: openai-completions
    - id: glm-5.3-flash
      name: GLM-5.3-Flash
      contextWindow: 1000000
      maxTokens: 131072
      vision: false
      thinking: true
      defaultEffort: high
      api: openai-completions
    - id: glm-5.3
      name: GLM-5.3
      contextWindow: 1000000
      maxTokens: 131072
      vision: false
      thinking: true
      defaultEffort: max
      api: openai-completions
    - id: deepseek-v4-pro
      name: DeepSeek V4 Pro
      contextWindow: 1000000
      maxTokens: 384000
      vision: false
      thinking: true
      defaultEffort: high
      api: openai-completions
    - id: deepseek-v4-flash-vision-exp
      name: DeepSeek V4 Flash Vision Exp
      contextWindow: 1000000
      maxTokens: 384000
      vision: true
      thinking: true
      defaultEffort: high
      api: openai-completions
    - id: grok-4.6
      name: Grok 4.6
      contextWindow: 500000
      maxTokens: 500000
      vision: true
      thinking: true
      defaultEffort: high
      api: openai-responses
    - id: muse-spark-1.3-contributor
      name: Muse Spark 1.3 Contributor
      vision: false
      thinking: false
      api: openai-responses
auto-continue:
  locale: en
